# ==================== 服务器 ====================
server:
  port: 8080

# ==================== 数据源 ====================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/your_database?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.enshi.springmart.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== JWT ====================
jwt:
  secret: YourSecretKeyHere
  expiration: 86400000  # 24小时，单位毫秒
  header: Authorization
  prefix: "Bearer "

# ==================== 文件上传 ====================
file:
  upload:
    path: ./uploads/
    max-size: 10MB

# ==================== argon2 ====================
crypto:
  argon2:
    salt-length: 16      # 盐值长度（字节），默认 16
    hash-length: 32      # 生成的哈希长度（字节），默认 32
    parallelism: 2       # 线程数（并发度），根据服务器 CPU 核心数调整
    memory: 65536        # 内存开销 (KB)，65536 KB = 64MB (推荐的 Web 安全水位)
    iterations: 3        # 迭代次数 (时间开销)，默认 3